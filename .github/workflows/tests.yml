name: Tests

# ⚠️ En **toda** rama, no solo en `main`, desde el 2026-09-16.
#
# Hasta ese día era `branches: [main]`, y tenía sentido mientras se trabajaba
# directo sobre `main`. Ese mismo día el criterio cambió —lo que se ve o se
# publica va por rama, y las ramas no llevan PR porque "el preview y el CI ya
# dicen lo que un PR diría"— y así **el CI no corría en ninguna rama**: ni por
# push, porque no era `main`, ni por `pull_request`, porque no hay PR. La
# primera rama con la regla nueva se subió sin una sola corrida.
#
# `pull_request` se queda para el día que revise alguien más. Mientras tanto
# no duplica nada, porque no hay PRs.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: python -m pytest tests -q

      - run: python -m ruff check bogota_music_intel tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm test

      # Se agregó el 2026-09-01, y no estaba antes por olvido: el frontend era
      # el único lado sin linter en CI —ruff sí corre del lado de Python— y
      # `ThemeToggle.tsx` estuvo violando `react-hooks/set-state-in-effect`
      # desde el 2026-08-31 sin que nadie se enterara.
      - run: npm run lint

      # Next genera los helpers PageProps/LayoutProps en .next/types; sin
      # esto tsc no los encuentra en un checkout limpio.
      - run: npx next typegen

      - run: npx tsc --noEmit

      # Si los secrets están configurados, el build prerenderiza contra la
      # base real. Si no, corre con valores de relleno: la home cae en su
      # estado "sin conexión" y el build sigue siendo una verificación
      # válida de compilación y tipos, sin volver rojo el CI por una
      # credencial que todavía no se cargó.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BMI_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BMI_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}
        run: npm run build
