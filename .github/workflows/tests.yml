name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: python -m pytest tests -q

      - run: python -m ruff check bogota_music_intel tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npx tsc --noEmit

      # El build necesita las variables para prerenderizar la cartelera.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BMI_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BMI_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
