name: Scraper cron

on:
  schedule:
    # 09:00 America/Bogota (UTC-5) = 14:00 UTC, daily
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  scrape-events:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e .

      - name: Run event scrapers
        env:
          bmi_supabase_url: ${{ secrets.BMI_SUPABASE_URL }}
          bmi_supabase_service_role_key: ${{ secrets.BMI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m bogota_music_intel.scrape_cli

      # Filtro editorial: marca qué es música y qué artista es local. Va
      # aparte del scraping y solo mira lo que llegó sin clasificar, así que
      # es incremental y barato.
      #
      # A diferencia de la geocodificación —que se deja a mano porque la
      # política de Nominatim pide no automatizarla— MusicBrainz solo limita
      # el ritmo, y el módulo ya lo respeta.
      #
      # Corre aunque el scraping haya fallado en alguna fuente: las que sí
      # entraron merecen quedar clasificadas igual.
      - name: Classify events
        if: '!cancelled()'
        env:
          bmi_supabase_url: ${{ secrets.BMI_SUPABASE_URL }}
          bmi_supabase_service_role_key: ${{ secrets.BMI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m bogota_music_intel.classify_cli

      # Cola de moderación: abre un borrador por cada evento nuevo y marca
      # los publicados cuya fuente se movió. Va DESPUÉS de clasificar para
      # que el borrador herede event_type e is_local ya resueltos y el admin
      # no tenga que decidirlos a mano.
      #
      # No publica nada: eso lo hace una persona. Ver
      # docs/investigacion-tecnica-plataforma-musical.md § 9.
      - name: Moderation queue
        if: '!cancelled()'
        env:
          bmi_supabase_url: ${{ secrets.BMI_SUPABASE_URL }}
          bmi_supabase_service_role_key: ${{ secrets.BMI_SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m bogota_music_intel.moderacion_cli
